name: browser-agent-preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
      - uses: actions/checkout@v4
        with:
          repository: lexmount/lexmount-python-sdk
          ref: 3d5b51c48c9b5298485a849efe0d938a4808db74
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install companion SDK and validate examples
        working-directory: examples
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ../sdk
          python -m unittest test_quickstart_auth test_browser_agent_recovery
          python -m compileall -q browser_agent.py browser_agent_async.py browser_agent_advanced.py browser_agent_common.py browser_agent_recovery.py
